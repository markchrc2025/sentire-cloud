<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentire Cloud</title>
<link rel="icon" href="/mark.svg">
<link rel="stylesheet" href="/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sentire-font); color: var(--sentire-ink); background: var(--sentire-surface-muted); }
  header { background: var(--sentire-ink); color: #fff; padding: 20px 32px; display: flex; align-items: center; gap: 14px; }
  header img { width: 40px; height: 40px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 2px 0 0; color: var(--sentire-mint); font-size: 14px; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 24px 48px; }
  .summary { background: var(--sentire-surface); border-radius: var(--sentire-radius); padding: 18px 22px; margin-bottom: 26px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--sentire-mint); }
  .summary.down { border-left-color: #c0392b; }
  .summary strong { font-size: 18px; }
  h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .05em; color: var(--sentire-ink-muted); margin: 26px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--sentire-surface); border-radius: var(--sentire-radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .name { font-weight: 700; font-size: 16px; }
  .engine { color: var(--sentire-ink-muted); font-size: 13px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .up { background: #e3f4ef; color: #1e7a5f; }
  .down { background: #fbe4e1; color: #a5281b; }
  .wait { background: #eef1f3; color: var(--sentire-ink-muted); }
  a { color: var(--sentire-ink); }
  .meta { font-size: 12px; color: var(--sentire-ink-muted); }
  footer { text-align: center; font-size: 12px; color: var(--sentire-ink-muted); padding: 24px; }
</style>
</head>
<body>
<header>
  <img src="/mark.svg" alt="">
  <div><h1>Sentire Cloud</h1><p>Where Sentire products run</p></div>
</header>
<main>
  <div class="summary" id="summary"><strong>Checking services…</strong><span class="meta" id="checked"></span></div>
  <h2>Products</h2>
  <div class="grid" id="products"></div>
  <h2>Platform</h2>
  <div class="grid" id="platform"></div>
</main>
<footer>Sentire Cloud. Products built on Sentire Framework.</footer>
<script>
function card(s) {
  const el = document.createElement("div");
  el.className = "card";
  const state = s.up === undefined ? ["wait", "Checking"] : s.up ? (s.slow ? ["wait", "Slow"] : ["up", "Running"]) : ["down", s.error === "timeout" ? "Not answering" : "Down"];
  const top = document.createElement("div"); top.className = "row";
  const name = document.createElement("span"); name.className = "name"; name.textContent = s.name;
  const pill = document.createElement("span"); pill.className = "pill " + state[0]; pill.textContent = state[1];
  top.append(name, pill);
  const link = document.createElement("a"); link.href = s.url; link.textContent = s.url.replace("https://", ""); link.target = "_blank"; link.rel = "noopener";
  el.append(top, link);
  if (s.engine) { const e = document.createElement("span"); e.className = "engine"; e.textContent = s.engine; el.append(e); }
  if (s.ms !== undefined) { const m = document.createElement("span"); m.className = "meta"; m.textContent = s.up ? s.ms + " ms" : "HTTP " + (s.status || "none"); el.append(m); }
  return el;
}
async function load() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const d = await r.json();
    for (const k of ["products", "platform"]) {
      const box = document.getElementById(k); box.replaceChildren(...d[k].map(card));
    }
    const sum = document.getElementById("summary");
    if (d.allUp === null) { sum.firstElementChild.textContent = "Checking services…"; }
    else {
      const down = [...d.products, ...d.platform].filter((s) => !s.up).length;
      sum.classList.toggle("down", down > 0);
      sum.firstElementChild.textContent = down ? down + " service" + (down > 1 ? "s" : "") + " need attention" : "All services running";
    }
    document.getElementById("checked").textContent = d.checkedAt ? "Checked " + new Date(d.checkedAt).toLocaleString("en-PH", { timeZone: "Asia/Manila" }) : "";
  } catch { /* keep the last view */ }
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
